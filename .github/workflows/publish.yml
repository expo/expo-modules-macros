name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows tool (${{ matrix.arch }})
    # SwiftPM builds macro tools only for the host, so each architecture builds on a runner of its own.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            build_arch: amd64
          - arch: arm64
            runner: windows-11-arm
            build_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          build_arch: ${{ matrix.build_arch }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build release tool
        # Runs apple/build.js: builds the release plugin binary for this architecture as
        # apple/ExpoModulesMacros-<arch>.exe.
        run: npm run build

      - name: Upload tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ExpoModulesMacros-${{ matrix.arch }}
          path: apple/ExpoModulesMacros-${{ matrix.arch }}.exe
          if-no-files-found: error

  publish:
    name: Build and publish to npm
    needs: build-windows
    # Builds the native macOS tool binary, so it must run on macOS. The Windows binaries come from the
    # build-windows jobs.
    # The package declares swift-tools-version 6.2, which requires Xcode 26+.
    runs-on: macos-26
    permissions:
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
      # Required to push the version bump commit/tag and create the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The default token lets gh create the release and push the bump
          # commit/tag. Note: commits pushed with GITHUB_TOKEN do NOT trigger
          # other workflows (e.g. the Swift CI), by GitHub's design.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted publishing requires npm >= 11.5.1.
        run: npm install -g npm@latest

      - name: Configure git
        run: |
          git config user.name "expo-bot"
          git config user.email "expo-bot@users.noreply.github.com"

      - name: Bump version
        id: bump
        # Only edit package.json here; the commit, tag and release are created
        # at the end so a failed build/publish leaves the branch untouched.
        run: |
          version=$(npm version "${{ inputs.release_type }}" --no-git-tag-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumping to $version"
          # The platform packages get the same version, and `expo-modules-macros` lists them as
          # optional dependencies with that exact version.
          node scripts/set-platform-versions.js

      - name: Select Xcode
        # Pin to an Xcode that ships Swift 6.2 (required by Package.swift).
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apple/.build
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('apple/Package.resolved') }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve
        working-directory: apple

      - name: Install dependencies
        # The wrapper's `prepublishOnly` build needs `tsc`; the tool binary needs none.
        run: npm install

      - name: Build release tool
        # Runs apple/build.js: builds the release plugin binary,
        # copies it to apple/ExpoModulesMacros, and strips it.
        run: npm run build

      - name: Download Windows tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ExpoModulesMacros-*
          path: windows-tools
          merge-multiple: true

      - name: Add the Windows tools to their packages
        run: |
          for arch in x64 arm64; do
            mv "windows-tools/ExpoModulesMacros-$arch.exe" "platforms/win32-$arch/ExpoModulesMacros.exe"
            ls -l "platforms/win32-$arch/ExpoModulesMacros.exe"
          done

      - name: Publish the Windows packages
        # Published before `expo-modules-macros`, whose optional dependencies point at them, so that
        # package is never on npm without them. Each package needs trusted publishing (OIDC)
        # configured on npmjs.com for this workflow.
        run: |
          for arch in x64 arm64; do
            npm publish --access public "./platforms/win32-$arch"
          done

      - name: Publish
        # Authentication is handled via OIDC trusted publishing — no token needed.
        # npm generates provenance automatically when publishing via OIDC.
        run: npm publish --access public

      # Everything below only runs once the publish above has succeeded.

      - name: Commit, tag and push
        run: |
          version="${{ steps.bump.outputs.version }}"
          git commit -am "Release $version"
          # Use an annotated tag so `git push --follow-tags` actually pushes it
          # (--follow-tags ignores lightweight tags).
          git tag -a "$version" -m "Release $version"
          git push --follow-tags origin HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tag prerelease versions (those containing a hyphen) as prereleases.
        run: |
          version="${{ steps.bump.outputs.version }}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$version" \
            --title "$version" \
            --generate-notes \
            $prerelease
